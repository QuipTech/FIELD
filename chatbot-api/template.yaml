AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  FIELD website support chatbot (Amazon Bedrock). Standalone stack, fully separate
  from the FIELD platform; it has no access to customer or tenant data.

Parameters:
  BedrockModelId:
    Type: String
    Default: au.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >
      Bedrock model or inference profile ID used with the Converse API.
      Claude Haiku 4.5 (AU profile) by default; e.g. apac.amazon.nova-micro-v1:0 for Nova Micro.
  AllowedOrigin:
    Type: String
    Description: The only origin allowed to call the API, e.g. https://www.quiptechfield.com (no trailing slash)
  DailyLimitPerIp:
    Type: Number
    Default: 20
  GlobalDailyLimit:
    Type: Number
    Default: 1000
  SesFromEmail:
    Type: String
    Description: SES-verified sender address for lead notifications
  LeadNotifyEmail:
    Type: String
    Description: Inbox that receives lead notifications
  TurnstileSecretKey:
    Type: String
    NoEcho: true
    Description: Cloudflare Turnstile secret key
  BudgetAlertEmail:
    Type: String
    Description: Address that receives the $10/month AWS Budgets alerts

Resources:
  ChatApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10

  ChatFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/handler.ts
        Loader:
          - .md=text
    Properties:
      CodeUri: ./
      Handler: handler.handler
      Runtime: nodejs20.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 20
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          # AWS_REGION is set by Lambda automatically and is reserved, so it isn't listed here.
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          DAILY_LIMIT_PER_IP: !Ref DailyLimitPerIp
          GLOBAL_DAILY_LIMIT: !Ref GlobalDailyLimit
          SES_FROM_EMAIL: !Ref SesFromEmail
          LEAD_NOTIFY_EMAIL: !Ref LeadNotifyEmail
          TURNSTILE_SECRET_KEY: !Ref TurnstileSecretKey
          TABLE_NAME: !Ref UsageTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                # Cross-region inference profiles route to foundation models in other regions.
                - arn:aws:bedrock:*::foundation-model/*
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref SesFromEmail
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt UsageTable.Arn
      Events:
        Chat:
          Type: HttpApi
          Properties:
            ApiId: !Ref ChatApi
            Path: /chat
            Method: POST
        Lead:
          Type: HttpApi
          Properties:
            ApiId: !Ref ChatApi
            Path: /lead
            Method: POST

  ChatFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ChatFunction}
      RetentionInDays: 14

  UsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 10
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

Outputs:
  ApiUrl:
    Description: Set this as NEXT_PUBLIC_CHAT_API_URL for the landing page build
    Value: !Sub https://${ChatApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
